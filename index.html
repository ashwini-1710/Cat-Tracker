<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>CAT 2026 Tracker</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CAT 2026">
<meta name="theme-color" content="#0f0f13">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0f0f13;--sf:#1a1a22;--sf2:#22222e;--bd:#2e2e3e;--ac:#7c6af7;--ac2:#4fc3a1;--ac3:#f7956a;--tx:#e8e6f0;--tx2:#9896a8;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
#LS{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.lbox{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;}
.lbox h2{font-size:20px;margin-bottom:8px;}
.lbox p{font-size:12px;color:var(--tx2);margin-bottom:22px;line-height:1.6;}
.pin-row{display:flex;gap:12px;justify-content:center;margin-bottom:18px;}
.pd{width:54px;height:62px;border:2px solid var(--bd);border-radius:12px;background:var(--sf2);color:var(--tx);font-size:26px;text-align:center;outline:none;transition:border-color 0.2s;}
.pd:focus{border-color:var(--ac);}
.ebtn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--ac);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.errmsg{color:#e06060;font-size:12px;margin-top:10px;min-height:16px;}
.hint{font-size:11px;color:var(--tx2);margin-top:12px;line-height:1.7;}
.topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;position:sticky;top:0;z-index:100;}
.tr1{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.topbar h1{font-size:14px;font-weight:600;flex:1;}
.topbar h1 span{color:var(--ac);}
.streak{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--ac3);font-weight:600;}
.synbtn{background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer;padding:2px 6px;}
.pbar{height:3px;background:var(--bd);border-radius:2px;}
.pbar-f{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:2px;transition:width .4s;}
.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);}
.tab{flex:1;padding:9px 4px;border:none;background:transparent;color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--ac);border-bottom-color:var(--ac);background:var(--sf2);}
.sbar{font-size:10px;text-align:center;padding:3px 8px;}
.sbar.ok{background:#102218;color:var(--ac2);}
.sbar.err{background:#1e1618;color:#e06060;}
.sbar.loading{background:#1a1a2e;color:var(--tx2);}
.main{padding:10px 12px;max-width:700px;margin:0 auto;padding-bottom:40px;}
.wkhdr{display:flex;align-items:center;gap:8px;margin:14px 0 6px;}
.wkl{font-size:10px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;}
.wkln{flex:1;height:1px;background:var(--bd);}
.wksc{font-size:10px;color:var(--ac2);font-weight:600;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:2px 8px;}
.dc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;overflow:hidden;}
.dc.tod{border-color:var(--ac);}
.dc.alldone{border-color:#4fc3a155;background:#102218;}
.ck.lk{opacity:.55;pointer-events:none;cursor:default;}
.tnum.lk,.vinput.lk{opacity:.6;cursor:not-allowed;}
.dc.mockday{border-color:#3a8a5a;background:#1a2a1e;}
.dc.revday{border-color:#7c6af7;background:#1c1a2e;}
.rcheck{border-radius:10px;padding:11px 13px;margin-bottom:12px;border:1px solid var(--bd);}
.rctitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;opacity:.85;}
.rcline{font-size:13px;font-weight:600;line-height:1.4;}
.rcsub{font-size:11px;margin-top:5px;opacity:.8;}
.rc-good{background:#102218;border-color:#3a8a5a;color:var(--ac2);}
.rc-mid{background:#1e1a10;border-color:#8a6a2a;color:var(--ac3);}
.rc-low{background:#1e1618;border-color:#8a3a3a;color:#e0807a;}
.restartdiv{display:flex;align-items:center;gap:8px;margin:18px 0 10px;}
.rdln{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--ac));}
.rdl{font-size:11px;font-weight:700;color:var(--ac);white-space:nowrap;letter-spacing:.3px;}
.dh{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;user-select:none;}
.ddate{font-size:11px;font-weight:600;color:var(--tx2);min-width:88px;}
.ddate.tl{color:var(--ac);}
.tbadge{background:var(--ac);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;}
.dprog{flex:1;display:flex;align-items:center;gap:6px;}
.mbar{flex:1;height:3px;background:var(--bd);border-radius:2px;}
.mbarf{height:100%;background:var(--ac2);border-radius:2px;transition:width .3s;}
.dpct{font-size:10px;color:var(--tx2);min-width:26px;text-align:right;}
.chv{color:var(--tx2);font-size:11px;transition:transform .2s;}
.chv.open{transform:rotate(180deg);}
.tasks{padding:0 11px 8px;display:none;}
.tasks.open{display:block;}
.trow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid #2e2e3e44;}
.trow:first-child{border-top:none;}
.ck{width:22px;height:22px;border:2px solid var(--bd);border-radius:6px;cursor:pointer;flex-shrink:0;margin-top:1px;background:transparent;min-width:22px;display:flex;align-items:center;justify-content:center;}
.ck.on{background:var(--ac2);border-color:var(--ac2);}
.ck.on::after{content:'✓';color:#0f0f13;font-size:13px;font-weight:700;}
.tbody{flex:1;min-width:0;}
.sec{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-bottom:3px;}
.sQA{background:#1e1a3a;color:#a09af7;}
.sVARC{background:#101e2e;color:#60aee8;}
.sDILR{background:#102218;color:#4fc3a1;}
.sMOCK{background:#1a2a1e;color:#4fc3a1;}
.sREVISION{background:#2a2410;color:#f0c14b;}
.sREST{background:#2a1e14;color:#f7956a;}
.ttime{font-size:10px;font-weight:700;color:var(--ac3);margin-left:6px;}
.sPLAN{background:#1a1a22;color:#9896a8;}
.brk{font-size:11px;color:var(--tx2);padding:4px 0 4px 32px;border-top:1px solid #2e2e3e44;}
.brkc{font-size:11px;color:var(--tx2);padding:2px 12px;text-align:center;}
.brk b,.brkc b{color:var(--ac3);font-weight:600;margin-right:6px;}
.ttop{font-size:12px;font-weight:500;color:var(--tx);display:block;}
.tdesc{font-size:11px;color:var(--tx2);margin-top:1px;}
.trow.done .ttop,.trow.done .tdesc{text-decoration:line-through;opacity:.45;}
.today-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;}
.today-pct{font-size:32px;font-weight:700;}
.today-list{display:flex;flex-direction:column;gap:6px;}
.tcard{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;}
.tcard.done{background:var(--sf2);opacity:.7;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-bottom:14px;}
.stb{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center;}
.stv{font-size:20px;font-weight:700;color:var(--ac);}
.stl{font-size:10px;color:var(--tx2);margin-top:2px;}
.aw{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:12px;}
.awh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.awt{font-size:12px;font-weight:600;}
.awsc{font-size:18px;font-weight:700;}
.sg{color:var(--ac2);}.so{color:var(--ac3);}.sb{color:#e06060;}
.awg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px;}
.add{text-align:center;}
.adl{font-size:9px;color:var(--tx2);margin-bottom:3px;}
.adc{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin:0 auto;max-width:34px;}
.df{background:var(--ac2);color:#0f0f13;}.dp2{background:var(--ac3);color:#0f0f13;}.dn2{background:var(--bd);color:var(--tx2);}.dfu{background:var(--sf2);color:var(--tx2);opacity:.3;}
.awsecs{display:flex;gap:6px;flex-wrap:wrap;}
.awsec{flex:1;min-width:60px;background:var(--sf2);border-radius:8px;padding:7px;text-align:center;}
.awsl{font-size:10px;color:var(--tx2);margin-bottom:3px;}
.awsv{font-size:15px;font-weight:700;color:var(--ac);}
.vrow{padding:8px 0;border-top:1px solid #2e2e3e44;}
.vrow:first-child{border-top:none;}
.vinput{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:12px;padding:8px 10px;margin-top:5px;font-family:inherit;}
.vinput:focus{outline:none;border-color:var(--ac);}
.vsaved{font-size:9px;color:var(--ac2);margin-left:6px;opacity:0;transition:opacity .3s;}
.vsaved.show{opacity:1;}
.trow.test,.tcard.test{align-items:stretch;flex-direction:column;}
.tpart{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.tplabel{font-size:11px;color:var(--tx2);min-width:42px;}
.tnum{width:52px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-size:12px;padding:6px 7px;text-align:center;font-family:inherit;}
.tnum:focus{outline:none;border-color:var(--ac);}
.tacc{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--sf2);color:var(--tx2);margin-left:auto;}
.tacc.good{color:var(--ac2);}
.tacc.mid{color:var(--ac3);}
.tacc.low{color:#e06060;}
.testblk{margin-top:2px;}
.awh2{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;}
.testlog{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:4px 12px;margin-bottom:6px;}
.tlrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #2e2e3e44;font-size:11px;}
.tlrow:first-child{border-top:none;}
.tldate{color:var(--tx2);min-width:60px;}
.tltopic{flex:1;color:var(--tx);}
.tlacc{font-weight:700;}
.vocablog{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:12px;line-height:1.9;}
.vlword{color:var(--tx2);}
.vlword b{color:var(--tx);font-weight:600;}
.emptymsg{font-size:11px;color:var(--tx2);padding:10px 0;text-align:center;}
@media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr);}}
.flbanner{background:linear-gradient(135deg,#2a1e14,#1c1a2e);border:1px solid var(--ac3);border-radius:10px;padding:11px 13px;margin-bottom:12px;}
.frbanner{background:linear-gradient(135deg,#102a24,#1c1a2e);border:1px solid var(--ac2);border-radius:10px;padding:11px 13px;margin-bottom:12px;}
.frtitle{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--ac2);}
.frsub{font-size:11px;color:var(--tx2);margin-top:4px;line-height:1.6;}
.frsub b{color:var(--tx);}
.fltitle{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--ac3);}
.flsub{font-size:11px;color:var(--tx2);margin-top:4px;line-height:1.55;}
.flsub b{color:var(--tx);}
.fldiv{display:flex;align-items:center;gap:8px;margin:20px 0 10px;}
.fldl{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--ac3));}
.fldr{flex:1;height:2px;background:linear-gradient(270deg,transparent,var(--ac3));}
.fldt{font-size:12px;font-weight:800;color:var(--ac3);white-space:nowrap;letter-spacing:1px;}
.strat{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px;line-height:1.7;}
.strat summary{cursor:pointer;font-weight:700;font-size:12px;color:var(--ac);}
.strat b{color:var(--tx);}
.strat .sh{color:var(--ac2);font-weight:700;margin-top:8px;font-size:11px;letter-spacing:.4px;}
.strat div{color:var(--tx2);}
.sctbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;}
.sctbl th{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;padding:8px 4px;border-bottom:1px solid var(--bd);}
.sctbl td{padding:7px 4px;text-align:center;border-top:1px solid #2e2e3e44;}
.sctbl td.dt{text-align:left;padding-left:10px;color:var(--tx2);font-size:11px;}
.sctbl td.na{color:var(--tx2);opacity:.5;}
.sctbl .pc{font-size:10px;font-weight:700;display:block;}
.sctbl tr.avg td{font-weight:700;border-top:1px solid var(--bd);background:var(--sf2);}
.sctbl tr.tgt td{color:var(--ac3);font-size:11px;background:var(--sf2);}
.sctbl tr.avg td.dt,.sctbl tr.tgt td.dt{color:var(--tx);}
</style>
</head>

<div id="LS">

var FB_URL = 'https://cat-tracker-976ff-default-rtdb.firebaseio.com';
var LD = {}, EX = {}, userPin = null, curTab = 0, syncTimer = null, firstPaint = false;

// PIN setup
var pEls = ['p0','p1','p2','p3'].map(function(id){ return document.getElementById(id); });

pEls.forEach(function(el, i) {
  el.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g,'').slice(-1);
    if (this.value && i < 3) pEls[i+1].focus();
    if (i === 3 && this.value) login();
  });
  el.addEventListener('keydown', function(e) {
    if (e.key==='Backspace' && !this.value && i>0) pEls[i-1].focus();
    if (e.key==='Enter') login();
  });
});

document.getElementById('enterBtn').addEventListener('click', login);
document.getElementById('syncBtn').addEventListener('click', function(){ loadData(true); });
document.getElementById('t0').addEventListener('click', function(){ switchTab(0); });
document.getElementById('t1').addEventListener('click', function(){ switchTab(1); });
document.getElementById('t2').addEventListener('click', function(){ switchTab(2); });

// Auto-login
var saved = localStorage.getItem('cat2026_pin');
if (saved && saved.length===4) {
  pEls.forEach(function(e,i){ e.value=saved[i]; });
  setTimeout(login, 100);
} else {
  pEls[0].focus();
}

// FINAL LAP starts here. Days before it are frozen history (progress is kept, just read-only).
var FINAL_LAP_START = '2026-10-27';
var EXAM_DATE = '2026-11-29';
// 24-hour window: a day can only be edited while it is that calendar day on the device clock
// (12:00 am to 11:59 pm). Past days lock at midnight; future days stay locked until their day starts.
function isLocked(dt){ return dt < FINAL_LAP_START || dt !== getToday(); }

// Fresh-start wipe: bump RESET_VERSION whenever you want everything cleared again.
// The version is stored in Firebase (users/<pin>/meta/reset), so the wipe happens ONCE for the
// PIN -- opening the app on a new phone or after clearing site data does NOT wipe anything.
var RESET_VERSION = 'restart_20260921';
function fbWipe(path) {
  return fetch(FB_URL + '/users/' + userPin + '/' + path + '.json', { method: 'DELETE' });
}
function fbGetReset() {
  return fetch(FB_URL + '/users/' + userPin + '/meta/reset.json').then(function(r){ return r.json(); });
}
function fbSetReset(v) {
  return fetch(FB_URL + '/users/' + userPin + '/meta/reset.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(v)
  });
}

function login() {
  var pin = pEls.map(function(e){ return e.value; }).join('');
  if (pin.length!==4) { document.getElementById('errMsg').textContent='Enter all 4 digits'; return; }
  userPin = pin;
  localStorage.setItem('cat2026_pin', pin);
  document.getElementById('LS').style.display = 'none';
  document.getElementById('AS').style.display = 'block';
  setSbar('loading','Connecting...');
  fbGetReset().then(function(remote) {
    if (remote === RESET_VERSION) { loadData(false); return; }
    // First device to open this new plan: clear old progress once, then mark it done in Firebase
    LD = {}; EX = {};
    localStorage.setItem('cat_bk_'+userPin, '{}');
    localStorage.setItem('cat_ex_'+userPin, '{}');
    setSbar('loading','Starting fresh...');
    return Promise.all([fbWipe('tasks'), fbWipe('extra')]).then(function(){
      return fbSetReset(RESET_VERSION);
    }).then(function(){ loadData(false); });
  }).catch(function() {
    // Offline or Firebase unreachable: never wipe, just use what is saved locally
    loadData(false);
  });
  // Poll every 10s for live sync (clear any earlier timer so we never poll twice)
  if (syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(function(){ loadData(false); }, 10000);
}

// Firebase REST API - no SDK needed
function fbGet() {
  return fetch(FB_URL + '/users/' + userPin + '/tasks.json')
    .then(function(r){ return r.json(); });
}
function fbSet(key, val) {
  var obj = {}; obj[key] = val;
  return fetch(FB_URL + '/users/' + userPin + '/tasks.json', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(obj)
  });
}
// Extra store: vocab text + test scores (kept separate from the boolean tasks store)
function fbGetExtra() {
  return fetch(FB_URL + '/users/' + userPin + '/extra.json')
    .then(function(r){ return r.json(); });
}
function fbSetExtra(key, val) {
  var obj = {}; obj[key] = val;
  return fetch(FB_URL + '/users/' + userPin + '/extra.json', {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(obj)
  });
}

function loadData(showMsg) {
  if(showMsg) setSbar('loading','Syncing...');
  Promise.all([fbGet(), fbGetExtra()]).then(function(results) {
    var prev = JSON.stringify(LD) + JSON.stringify(EX);
    LD = results[0] || {};
    EX = results[1] || {};
    localStorage.setItem('cat_bk_'+userPin, JSON.stringify(LD));
    localStorage.setItem('cat_ex_'+userPin, JSON.stringify(EX));
    setSbar('ok','🟢 Synced — live across all devices');
    // Always paint once after login (an empty fresh start has no data change to trigger a render)
    if (!firstPaint || (JSON.stringify(LD) + JSON.stringify(EX)) !== prev) { firstPaint = true; updateTop(); renderCur(); }
    else { updateTop(); }
  }).catch(function() {
    setSbar('err','Offline — saved locally');
    LD = JSON.parse(localStorage.getItem('cat_bk_'+userPin)||'{}');
    EX = JSON.parse(localStorage.getItem('cat_ex_'+userPin)||'{}');
    firstPaint = true; updateTop(); renderCur();
  });
}

// Save a vocab/test value: local-first, background sync, no full re-render (keeps input focus)
function saveExtra(key, val) {
  if (isLocked(key.split('_')[0])) return;
  EX[key] = val;
  localStorage.setItem('cat_ex_'+userPin, JSON.stringify(EX));
  fbSetExtra(key, val);
  updateDayCard(key.split('_')[0]);
  updateTop();
}

function isTaskDone(day, t) {
  var key = day.date + '_' + t.id;
  if (t.type === 'vocab') {
    return !!(EX[key] && EX[key].trim().length > 0);
  }
  if (t.type === 'test') {
    var raw = EX[key];
    if (!raw) return false;
    try { var o = JSON.parse(raw); } catch(e) { return false; }
    if (t.testParts) return t.testParts.every(function(p){ return o[p] && Number(o[p].total) > 0; });
    return o.total && Number(o.total) > 0;
  }
  return !!LD[key];
}

function accClass(pct) {
  if (pct >= 75) return 'good';
  if (pct >= 50) return 'mid';
  return 'low';
}

function toggleTask(dt, id) {
  if (isLocked(dt)) return;
  var key = dt+'_'+id;
  LD[key] = !LD[key];
  localStorage.setItem('cat_bk_'+userPin, JSON.stringify(LD));
  // Update UI immediately
  var row = document.getElementById('r_'+key);
  var ck = row ? row.querySelector('.ck') : null;
  if(row) row.classList.toggle('done', !!LD[key]);
  if(ck) ck.classList.toggle('on', !!LD[key]);
  updateDayCard(dt);
  updateTop();
  if(curTab===0) renderToday();
  if(curTab===2) renderAna();
  // Save to Firebase
  fbSet(key, LD[key]);
}

function setSbar(st,msg){ var e=document.getElementById('sbarEl'); e.textContent=msg; e.className='sbar '+st; }
function isoLocal(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function getToday(){ return isoLocal(new Date()); }
// Consecutive fully-done days ending today, or ending yesterday if today is not finished yet
function computeStreak(){
  var d=new Date(getToday()+'T00:00:00'), streak=0, first=true;
  while(true){
    var iso=isoLocal(d);
    var day=SCH.find(function(x){return x.date===iso;});
    if(!day||!day.tasks) break;
    var c=getDC(day);
    if(c&&c.pct===100) streak++;
    else if(!first) break;
    first=false;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function computeRealityCheck(){
  var today=getToday();
  var todayIdx=SCH.findIndex(function(d){return d.date===today;});
  if(todayIdx===-1) return null;
  // This week = Monday to today
  var monday=new Date(today+'T00:00:00');
  var dow=monday.getDay(); var back=(dow===0?6:dow-1);
  monday.setDate(monday.getDate()-back);
  var mondayISO=isoLocal(monday);
  var weekDays=SCH.filter(function(d){return d.date>=mondayISO&&d.date<=today&&d.tasks;});
  var wTot=0,wDn=0,wPlannedDays=0,wFullDays=0;
  weekDays.forEach(function(d){
    var c=getDC(d);
    wTot+=c.total; wDn+=c.done;
    wPlannedDays++;
    if(c.pct===100) wFullDays++;
  });
  var wPct=wTot?Math.round(wDn/wTot*100):0;
  var streak=computeStreak();
  // Longest gap since the Final Lap began -- consecutive days with 0% done
  var restartIdx=Math.max(0,SCH.findIndex(function(d){return d.date>=FINAL_LAP_START;}));
  var longestGap=0,curGap=0;
  for(var i=restartIdx;i<=todayIdx;i++){
    var dd=SCH[i]; if(!dd.tasks) continue;
    var cc=getDC(dd);
    if(cc.pct===0){curGap++; if(curGap>longestGap) longestGap=curGap;} else curGap=0;
  }
  return {wPct:wPct,wPlannedDays:wPlannedDays,wFullDays:wFullDays,streak:streak,longestGap:longestGap};
}

function getDC(day){
  if(!day.tasks) return null;
  var dn=day.tasks.filter(function(t){return isTaskDone(day,t);}).length;
  return {done:dn,total:day.tasks.length,pct:Math.round(dn/day.tasks.length*100)};
}

function updateTop(){
  var streak=computeStreak();
  document.getElementById('streakEl').textContent='🔥 '+streak+' streak';
  var tot=0,dn=0;
  SCH.forEach(function(d){if(d.tasks){tot+=d.tasks.length;d.tasks.forEach(function(t){if(isTaskDone(d,t))dn++;});}});
  document.getElementById('pbarF').style.width=(tot?Math.round(dn/tot*100):0)+'%';
}

function updateDayCard(dt){
  var day=SCH.find(function(d){return d.date===dt;}); if(!day) return;
  var c=getDC(day); if(!c) return;
  var mb=document.getElementById('mb_'+dt), pp=document.getElementById('pp_'+dt), cd=document.getElementById('cd_'+dt);
  if(mb) mb.style.width=c.pct+'%';
  if(pp) pp.textContent=c.pct+'%';
  if(cd) cd.classList.toggle('alldone',c.pct===100);
}

function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function renderFinalLapBanner(){
  var today=getToday();
  var toExam=daysBetween(today,EXAM_DATE);
  var mocksLeft=0;
  SCH.forEach(function(d){ if(d.date>=today && d.date<EXAM_DATE && d.tasks){ d.tasks.forEach(function(t){ if(t.id==='mock_exam' && !isTaskDone(d,t)) mocksLeft++; }); } });
  var h='<div class="flbanner"><div class="fltitle">🏁 FINAL LAP</div><div class="flsub">';
  if(today<FINAL_LAP_START){
    h+='Starts <b>Oct 27</b>. Days before it are frozen. <b>'+toExam+'</b> days to CAT · <b>'+mocksLeft+'</b> mocks to go.';
  } else if(today>EXAM_DATE){
    h+='CAT is done. Whatever the result, you showed up.';
  } else {
    h+='Day <b>'+(daysBetween(FINAL_LAP_START,today)+1)+'</b> of '+(daysBetween(FINAL_LAP_START,EXAM_DATE)+1)+' · <b>'+toExam+'</b> days to CAT · <b>'+mocksLeft+'</b> mocks to go.';
  }
  h+='<br>📌 Syllabus is done. Now it is only mocks, PYQs and analysis.';
  h+='<br>🔒 Each day locks at 12:00 am. Log everything before midnight.</div></div>';
  return h;
}

function renderStrategyCard(){
  return '<details class="strat"><summary>📋 Exam strategy card (read before every mock)</summary>'
  +'<div class="sh">VARC · 40 MIN · 15 ATTEMPTS, 11 RIGHT</div>'
  +'<div>Skim 4 passages in 90 sec, pick the 2 you can sum up in one line. Swap once only, if stuck by minute 3.<br>Order: <b>VA first</b> (OOO → para summary only if 2 options are dead → PJ last), then RC1, RC2. Test VA-first vs RC-first in 2 mocks and keep what scores better.<br>RC pace: read 3-4 min, questions ~5 min, max 90 sec per Q.<br>Inference Qs: go back to the lines, make your own 5-8 word answer, then mark each option ✓ / ✗ / ? one by one. Kill extreme words (only, always, never) and out-of-scope ideas.</div>'
  +'<div class="sh">DILR · 40 MIN · ~14-16 MARKS</div>'
  +'<div>Skim 3-4 min, rank sets by how fast you can draw the setup, solve your top 2 fully. Setup cap 8 min, switch once only. Finish a set rather than leave it 80% done.<br>Cases on the most constrained variable, tick off conditions as you use them, Venn: fill from the centre outwards. TITA has no negative, always type an answer.</div>'

  +'</details>';
}

function renderRealityCheck(){
  var r=computeRealityCheck();
  if(!r) return '';
  var missedDays=r.wPlannedDays-r.wFullDays;

  else if(r.wPct>=60){ tone='mid'; line='This week: '+r.wFullDays+'/'+r.wPlannedDays+' days fully done ('+r.wPct+'%). '+missedDays+' day(s) not fully done -- close it out.'; }
  else { tone='low'; line='This week: only '+r.wFullDays+'/'+r.wPlannedDays+' days fully done ('+r.wPct+'%). '+missedDays+' day(s) missed or half-done. That is the real number, not a feeling.'; }
  var streakLine = r.streak>0 ? r.streak+'-day streak going.' : 'No active streak right now.';
  var gapLine = r.longestGap>=2 ? ' Longest gap since restart: '+r.longestGap+' day(s) with nothing logged.' : '';
  var h='<div class="rcheck rc-'+tone+'">';

  h+='<div class="rcsub">'+streakLine+gapLine+'</div>';

  return h;

function tm(t){ return t.time ? '<span class="ttime">'+t.time+'</span>' : ''; }
function dayRows(day,cardMode){
  var items=[];
  (day.tasks||[]).forEach(function(t,i){ items.push({s:(t.s!==undefined?t.s:99999),i:i,t:t}); });
  (day.breaks||[]).forEach(function(b,i){ items.push({s:b.s,i:1000+i,b:b}); });
  items.sort(function(x,y){ return x.s-y.s || x.i-y.i; });
  var h='';
  items.forEach(function(it){
    if(it.t) h+=renderTaskRow(day,it.t,cardMode);
    else h+='<div class="'+(cardMode?'brkc':'brk')+'"><b>'+it.b.time+'</b>'+it.b.label+'</div>';
  });
  return h;
}
function renderTaskRow(day,t,cardMode){
  var key=day.date+'_'+t.id;

    h+='<span class="ttop">'+t.topic+'</span>';
    h+='<input class="vinput" data-dt="'+day.date+'" data-id="'+t.id+'" placeholder="e.g. taciturn - reserved, says little" value="'+val.replace(/"/g,'&quot;')+'">';
    h+='<span class="vsaved" id="vs_'+key+'">saved ✓</span></div></div>';

  }
  if(t.type==='test'){
    var o=readTestVal(day,t);
    var h='<div class="'+wrap+' test" id="r_'+key+'">';
    h+='<div class="tbody" style="width:100%"><span class="sec s'+t.section+'">'+t.section+'</span>'+tm(t);

      h+='<div class="tpart">';
      if(p) h+='<span class="tplabel">'+p+'</span>';
      h+='<span class="tplabel">Attempted</span><input class="tnum" type="number" min="0" inputmode="numeric" data-dt="'+day.date+'" data-id="'+t.id+'" data-part="'+(p||'')+'" data-field="total" value="'+tot+'">';
      h+='<span class="tplabel">Correct</span><input class="tnum" type="number" min="0" inputmode="numeric" data-dt="'+day.date+'" data-id="'+t.id+'" data-part="'+(p||'')+'" data-field="correct" value="'+cor+'">';
      h+='<span class="tplabel">Percentile</span><input class="tnum" type="number" min="0" max="100" step="0.01" inputmode="decimal" data-dt="'+day.date+'" data-id="'+t.id+'" data-part="'+(p||'')+'" data-field="percentile" value="'+per+'">';

      h+='</div>';
    }
    h+='</div></div></div>';
    return h;
  }
  var chk=!!LD[key];
  var h='<div class="'+wrap+(chk?' done':'')+'" id="r_'+key+'">';
  h+='<div class="ck'+(chk?' on':'')+'" data-dt="'+day.date+'" data-id="'+t.id+'"></div>';

function wireTaskInputs(root){
  root.querySelectorAll('.ck,.vinput,.tnum').forEach(function(el){
    if(isLocked(el.dataset.dt)){ el.classList.add('lk'); if(el.tagName==='INPUT') el.disabled=true; }
  });
  root.querySelectorAll('.ck').forEach(function(ck){
    ck.addEventListener('click',function(){toggleTask(this.dataset.dt,this.dataset.id);});
  });
  root.querySelectorAll('.vinput').forEach(function(inp){
    var t; inp.addEventListener('input',function(){
      var dt=this.dataset.dt,id=this.dataset.id,el=this;
      clearTimeout(t); t=setTimeout(function(){
        saveExtra(dt+'_'+id, el.value);
        var vs=document.getElementById('vs_'+dt+'_'+id);
        if(vs){vs.classList.add('show');setTimeout(function(){vs.classList.remove('show');},1200);}
        if(curTab===2) renderAna();
      },500);
    });
  });
  root.querySelectorAll('.tnum').forEach(function(inp){
    inp.addEventListener('input',function(){
      var dt=this.dataset.dt,id=this.dataset.id,part=this.dataset.part,field=this.dataset.field;
      var key=dt+'_'+id;
      var o; try{o=JSON.parse(EX[key]||'{}');}catch(e){o={};}
      if(part){ o[part]=o[part]||{}; o[part][field]=this.value; }
      else{ o[field]=this.value; }
      saveExtra(key, JSON.stringify(o));
      if(curTab===2) renderAna();
    });
  });
}

function renderTestScoreSummary(){
  var entries=[];
  SCH.forEach(function(day){
    (day.tasks||[]).forEach(function(t){
      if(t.type!=='test') return;
      if(!isTaskDone(day,t)) return;
      var o=readTestVal(day,t);
      if(t.testParts){
        var totSum=0,corSum=0,bits=[];
        t.testParts.forEach(function(p){
          var pv=o[p]||{}; var tt=Number(pv.total)||0, cc=Number(pv.correct)||0;
          totSum+=tt; corSum+=cc;
          bits.push(p+' '+(tt?Math.round(cc/tt*100):0)+'%');
        });
        var pct=totSum?Math.round(corSum/totSum*100):0;
        entries.push({date:day.date,label:day.label,topic:t.topic,section:t.section,pct:pct,detail:bits.join(' · ')});
      } else {
        var tt=Number(o.total)||0, cc=Number(o.correct)||0;
        var pct=tt?Math.round(cc/tt*100):0;
        entries.push({date:day.date,label:day.label,topic:t.topic,section:t.section,pct:pct,detail:cc+'/'+tt+' correct'});
      }
    });
  });
  if(!entries.length) return '';
  entries.sort(function(a,b){return a.date<b.date?1:-1;});
  var avgFor=function(sec){var l=entries.filter(function(e){return e.section===sec;});if(!l.length)return null;return Math.round(l.reduce(function(s,e){return s+e.pct;},0)/l.length);};
  var aQA=avgFor('QA'),aDILR=avgFor('DILR'),aVARC=avgFor('VARC'),aMOCK=avgFor('MOCK');
  var avgH='<div class="stats">';
  if(aQA!==null) avgH+='<div class="stb"><div class="stv">'+aQA+'%</div><div class="stl">QA Test Avg</div></div>';
  if(aDILR!==null) avgH+='<div class="stb"><div class="stv">'+aDILR+'%</div><div class="stl">DILR Test Avg</div></div>';
  if(aVARC!==null) avgH+='<div class="stb"><div class="stv">'+aVARC+'%</div><div class="stl">VARC Test Avg</div></div>';
  if(aMOCK!==null) avgH+='<div class="stb"><div class="stv">'+aMOCK+'%</div><div class="stl">Mock Avg</div></div>';
  avgH+='<div class="stb"><div class="stv">'+entries.length+'</div><div class="stl">Tests Logged</div></div></div>';
  var listH='<div class="testlog">';
  entries.slice(0,20).forEach(function(e){
    listH+='<div class="tlrow"><div class="tldate">'+e.label.split(' ').slice(0,2).join(' ')+'</div><div class="tltopic">'+e.topic+'<div style="color:var(--tx2);font-size:10px">'+e.detail+'</div></div><div class="tlacc '+accClass(e.pct)+'">'+e.pct+'%</div></div>';
  });
  listH+='</div>';
  return '<div class="awh2">Test Scores</div>'+avgH+listH;
}

function renderAna(){
  var today=getToday();
  var sd=SCH.filter(function(d){return d.tasks&&d.date<=today;});
  var tot=0,dn=0,fd=0;
  sd.forEach(function(d){tot+=d.tasks.length;var x=0;d.tasks.forEach(function(t){if(isTaskDone(d,t)){dn++;x++;}});if(x===d.tasks.length)fd++;});
  var pct=tot?Math.round(dn/tot*100):0;
  var streak=computeStreak();
  var h='<div class="stats"><div class="stb"><div class="stv">'+pct+'%</div><div class="stl">Overall</div></div><div class="stb"><div class="stv">'+streak+'</div><div class="stl">🔥 Streak</div></div><div class="stb"><div class="stv">'+fd+'</div><div class="stl">Full Days</div></div><div class="stb"><div class="stv">'+sd.length+'</div><div class="stl">Days Past</div></div></div>';
  h+=renderSectionalTable();
  h+=renderTestScoreSummary();
  var weeks=[],wk=[],ws='';
  SCH.forEach(function(day,i){var dow=new Date(day.date+'T00:00:00').getDay();if((dow===1||i===0)&&wk.length){weeks.push({days:wk,label:ws});wk=[];}if(dow===1||i===0)ws=day.label.split(' ').slice(0,2).join(' ');wk.push(day);});
  if(wk.length)weeks.push({days:wk,label:ws});
  weeks.forEach(function(week,wi){
    var wsd=week.days.filter(function(d){return d.tasks;});
    var wd=0,wt=0;
    wsd.forEach(function(d){wt+=d.tasks.length;d.tasks.forEach(function(t){if(isTaskDone(d,t))wd++;});});
    var wp=wt?Math.round(wd/wt*100):0;
    var sc=wp>=80?'sg':wp>=50?'so':'sb';
    var af=wsd.every(function(d){return d.date>today;});
    var dh='';
    week.days.forEach(function(day){
      var dname=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(day.date+'T00:00:00').getDay()];
      var dc,dt2;
      if(day.date>today){dc='dfu';dt2='—';}
      else{var c=getDC(day);if(!c){dc='dfu';dt2='—';}else if(c.pct===100){dc='df';dt2='✓';}else if(c.pct>0){dc='dp2';dt2=c.pct+'%';}else{dc='dn2';dt2='✗';}}
      dh+='<div class="add"><div class="adl">'+dname+'</div><div class="adc '+dc+'">'+dt2+'</div></div>';
    });
    var secs={QA:{d:0,t:0},VARC:{d:0,t:0},DILR:{d:0,t:0},MOCK:{d:0,t:0},REVISION:{d:0,t:0}};
    wsd.forEach(function(day){(day.tasks||[]).forEach(function(t){if(secs[t.section]){secs[t.section].t++;if(isTaskDone(day,t))secs[t.section].d++;}});});
    var sh='';
    Object.keys(secs).forEach(function(sec){var v=secs[sec];if(!v.t)return;sh+='<div class="awsec"><div class="awsl">'+sec+'</div><div class="awsv">'+Math.round(v.d/v.t*100)+'%</div></div>';});
    h+='<div class="aw"><div class="awh"><div class="awt">Week '+(wi+1)+' · '+week.label+'</div>'+(af?'<div style="font-size:11px;color:var(--tx2)">upcoming</div>':'<div class="awsc '+sc+'">'+wp+'%</div>')+'</div><div class="awg">'+dh+'</div>'+(sh?'<div class="awsecs">'+sh+'</div>':'')+'</div>';
  });
  document.getElementById('p2x').innerHTML=h;
}

function switchTab(n){
  curTab=n;
  ['p0x','p1x','p2x'].forEach(function(id,i){document.getElementById(id).style.display=i===n?'':'none';});
  ['t0','t1','t2'].forEach(function(id,i){document.getElementById(id).classList.toggle('active',i===n);});
  renderCur();
}
function renderCur(){if(curTab===0)renderToday();else if(curTab===1)renderAll();else renderAna();}

// Re-lock automatically when the date rolls over (app left open past midnight)
var lastDay=getToday();
function dayRollover(){
  var t=getToday();
  if(t!==lastDay){ lastDay=t; if(userPin){ updateTop(); renderCur(); } }
}
setInterval(dayRollover,15000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) dayRollover(); });

// PWA install
var dp;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();dp=e;
  setTimeout(function(){
    if(dp&&document.getElementById('AS').style.display!=='none'){
      var b=document.createElement('div');
      b.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1a1a22;border-top:1px solid #7c6af7;padding:12px 16px;display:flex;align-items:center;gap:12px;';
      b.innerHTML='<div style="flex:1"><div style="font-size:13px;font-weight:600;color:#e8e6f0">Install as App</div><div style="font-size:11px;color:#9896a8">No browser bar</div></div>';
      var ib=document.createElement('button');
      ib.textContent='Install';ib.style.cssText='background:#7c6af7;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;';
      ib.addEventListener('click',function(){dp.prompt();dp.userChoice.then(function(){dp=null;b.remove();});});
      var cb=document.createElement('button');
      cb.textContent='✕';cb.style.cssText='background:none;border:none;color:#9896a8;font-size:20px;cursor:pointer;';
      cb.addEventListener('click',function(){b.remove();});
      b.appendChild(ib);b.appendChild(cb);document.body.appendChild(b);
    }
  },3000);
});

// Service Worker - required for PWA install
if ('serviceWorker' in navigator) {
  var swCode = `
    self.addEventListener('install', function(e) { self.skipWaiting(); });
    self.addEventListener('activate', function(e) { e.waitUntil(clients.claim()); });
    self.addEventListener('fetch', function(e) {
      e.respondWith(fetch(e.request).catch(function() {
        return caches.match(e.request);
      }));
    });
  `;
  var blob = new Blob([swCode], {type: 'application/javascript'});
  var swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).then(function(reg) {
    console.log('SW registered');
  }).catch(function(e) { console.log('SW error', e); });
}
